    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статьи о славянской мифологии</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Comfortaa', 'Russo One', Arial, sans-serif;
            background:
                linear-gradient(rgba(25, 25, 112, 0.85), rgba(43, 15, 0, 0.85)),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%238B4513" opacity="0.1"/><path d="M0,0 L100,100 M100,0 L0,100" stroke="%23FFD700" stroke-width="1" opacity="0.1"/></svg>');
            color: #f5f5f5;
            line-height: 1.6;
            padding: 10px;
            min-height: 100vh;
        }

        .articles-container { max-width: 1200px; margin: 0 auto; padding: 10px; }

        /* Навигация */
        .main-nav {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .nav-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-link {
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 25px;
            color: #ffd700;
            text-decoration: none;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .nav-link:hover {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            transform: translateY(-2px);
        }

        .nav-link.active {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #000;
            border-color: #ffd700;
        }

        /* Заголовок */
        .articles-header {
            text-align: center;
            padding: 20px 5px;
            margin-bottom: 30px;
        }

        .articles-title {
            font-family: 'Russo One', sans-serif;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .articles-subtitle {
            font-size: 1rem;
            color: #bdc3c7;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Фильтры и поиск */
        .articles-controls {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            max-width: 500px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #ffd700;
        }

        .tag-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag-btn {
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            color: #bdc3c7;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .tag-btn:hover {
            border-color: #ffd700;
            color: #ffd700;
        }

        .tag-btn.active {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #000;
            border-color: #ffd700;
        }

        /* Сетка статей */
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .article-card {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.2);
            transition: all 0.3s;
            cursor: pointer;
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 215, 0, 0.5);
        }

        .article-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.3);
        }

        .article-content {
            padding: 20px;
        }

        .article-tags {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .article-tag {
            font-size: 0.75rem;
            padding: 4px 10px;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 15px;
            color: #ffd700;
        }

        .article-title {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #ffd700;
            font-family: 'Russo One', sans-serif;
            line-height: 1.3;
        }

        .article-excerpt {
            font-size: 0.95rem;
            color: #ecf0f1;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #95a5a6;
        }

        .article-date {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .article-readtime {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Модальное окно для полной статьи */
        .article-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            overflow-y: auto;
        }

        .article-modal.active {
            display: block;
        }

        .modal-content {
            max-width: 900px;
            margin: 40px auto;
            background: rgba(25, 25, 112, 0.95);
            border-radius: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #ffd700;
            font-size: 1.2rem;
            transition: all 0.3s;
            z-index: 10;
        }

        .modal-close:hover {
            background: rgba(255, 215, 0, 0.3);
            transform: rotate(90deg);
        }

        .article-full {
            padding: 40px;
        }

        .article-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .article-full-title {
            font-size: 2rem;
            color: #ffd700;
            font-family: 'Russo One', sans-serif;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .article-full-meta {
            display: flex;
            justify-content: center;
            gap: 20px;
            color: #95a5a6;
            font-size: 0.9rem;
        }

        .article-full-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .article-body {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #ecf0f1;
        }

        .article-body h2 {
            font-size: 1.6rem;
            color: #ffd700;
            margin: 30px 0 15px;
            font-family: 'Russo One', sans-serif;
        }

        .article-body h3 {
            font-size: 1.3rem;
            color: #ff8c00;
            margin: 25px 0 12px;
        }

        .article-body p {
            margin-bottom: 15px;
        }

        .article-body ul, .article-body ol {
            margin: 15px 0 15px 30px;
        }

        .article-body li {
            margin-bottom: 8px;
        }

        .article-body blockquote {
            background: rgba(255, 215, 0, 0.1);
            border-left: 4px solid #ffd700;
            padding: 15px 20px;
            margin: 20px 0;
            font-style: italic;
        }

        .article-body img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
        }

        /* Пагинация */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 40px 0;
        }

        .page-btn {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .page-btn:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        .page-btn.active {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #000;
            border-color: #ffd700;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .articles-title { font-size: 1.6rem; }
            .articles-grid { grid-template-columns: 1fr; }
            .article-full { padding: 20px; }
            .article-full-title { font-size: 1.5rem; }
            .controls-row { flex-direction: column; }
            .search-box { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="articles-container">
        <!-- Навигация -->
        <nav class="main-nav">
            <div class="nav-links">
                <a href="index.html" class="nav-link">
                    <i class="fas fa-home"></i>
                    <span>Пантеон богов</span>
                </a>
                <a href="articles.html" class="nav-link active">
                    <i class="fas fa-scroll"></i>
                    <span>Статьи</span>
                </a>
            </div>
        </nav>

        <!-- Заголовок -->
        <header class="articles-header">
            <h1 class="articles-title">Статьи о славянской мифологии</h1>
            <p class="articles-subtitle">Исследования, легенды и интересные факты о древнерусских богах и традициях</p>
        </header>

        <!-- Фильтры и поиск -->
        <div class="articles-controls">
            <div class="controls-row">
                <div class="search-box">
                    <input type="text" class="search-input" id="articleSearch" placeholder="Поиск статей...">
                    <i class="search-icon fas fa-search"></i>
                </div>
                <div class="tag-filters">
                    <button class="tag-btn active" data-tag="all">Все статьи</button>
                    <button class="tag-btn" data-tag="gods">Боги</button>
                    <button class="tag-btn" data-tag="rituals">Обряды</button>
                    <button class="tag-btn" data-tag="holidays">Праздники</button>
                    <button class="tag-btn" data-tag="myths">Мифы</button>
                </div>
            </div>
        </div>

        <!-- Сетка статей -->
        <div class="articles-grid" id="articlesGrid">
            <!-- Статьи будут добавлены через JavaScript -->
        </div>

        <!-- Пагинация -->
        <div class="pagination" id="pagination">
            <button class="page-btn" id="prevPage"><i class="fas fa-chevron-left"></i></button>
            <div id="pageNumbers"></div>
            <button class="page-btn" id="nextPage"><i class="fas fa-chevron-right"></i></button>
        </div>

        <!-- Модальное окно для статьи -->
        <div class="article-modal" id="articleModal">
            <div class="modal-content">
                <button class="modal-close" onclick="closeArticle()">
                    <i class="fas fa-times"></i>
                </button>
                <article class="article-full" id="articleFull">
                    <!-- Содержимое статьи -->
                </article>
            </div>
        </div>
    </div>

    <!-- 1. Сначала подключаем файл с данными -->
    <script src="articles_text.js"></script>
    
    <!-- 2. Затем подключаем скрипт, который будет эти данные использовать -->
    <script>
        // Состояние приложения
        let currentPage = 1;
        const articlesPerPage = 6;
        let filteredArticles = [...articlesData];
        let activeTag = 'all';

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            renderArticles();
            initializeControls();
        });

        // Функция отрисовки статей
        function renderArticles() {
            const grid = document.getElementById('articlesGrid');
            const start = (currentPage - 1) * articlesPerPage;
            const end = start + articlesPerPage;
            const pageArticles = filteredArticles.slice(start, end);

            grid.innerHTML = pageArticles.map(article => `
                <article class="article-card" onclick="openArticle(${article.id})">
                    <img src="${article.image || createPlaceholderImage(article.title)}" 
                         alt="${article.title}" 
                         class="article-image"
                         onerror="this.src='${createPlaceholderImage(article.title)}'">
                    <div class="article-content">
                        <div class="article-tags">
                            ${article.tags.map(tag => `
                                <span class="article-tag">${getTagName(tag)}</span>
                            `).join('')}
                        </div>
                        <h2 class="article-title">${article.title}</h2>
                        <p class="article-excerpt">${article.excerpt}</p>
                        <div class="article-meta">
                            <span class="article-date">
                                <i class="fas fa-calendar"></i>
                                ${formatDate(article.date)}
                            </span>
                            <span class="article-readtime">
                                <i class="fas fa-clock"></i>
                                ${article.readTime}
                            </span>
                        </div>
                    </div>
                </article>
            `).join('');

            renderPagination();
        }

        // Функция создания заглушки для изображения
        function createPlaceholderImage(title) {
            const colors = ['#00bcd4', '#4caf50', '#f44336', '#ff9800', '#9c27b0'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            return `data:image/svg+xml;charset=UTF-8,%3Csvg width='400' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='400' height='200' fill='${encodeURIComponent(color)}'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='Russo One' font-size='24' fill='white'%3E${encodeURIComponent(title.substring(0, 20))}%3C/text%3E%3C/svg%3E`;
        }

        // Пагинация
        function renderPagination() {
            const totalPages = Math.ceil(filteredArticles.length / articlesPerPage);
            const pageNumbers = document.getElementById('pageNumbers');
            
            pageNumbers.innerHTML = '';
            
            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.textContent = i;
                pageBtn.onclick = () => goToPage(i);
                pageNumbers.appendChild(pageBtn);
            }

            // Управление кнопками prev/next
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        function goToPage(page) {
            currentPage = page;
            renderArticles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Инициализация контролов
        function initializeControls() {
            // Поиск
            const searchInput = document.getElementById('articleSearch');
            let searchTimeout;
            
            searchInput.addEventListener('input', function(e) {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    filterArticles();
                }, 300);
            });

            // Теги
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    activeTag = this.getAttribute('data-tag');
                    filterArticles();
                });
            });

            // Пагинация
            document.getElementById('prevPage').onclick = () => {
                if (currentPage > 1) goToPage(currentPage - 1);
            };

            document.getElementById('nextPage').onclick = () => {
                const totalPages = Math.ceil(filteredArticles.length / articlesPerPage);
                if (currentPage < totalPages) goToPage(currentPage + 1);
            };
        }

        // Фильтрация статей
        function filterArticles() {
            const searchTerm = document.getElementById('articleSearch').value.toLowerCase();
            
            filteredArticles = articlesData.filter(article => {
                const matchesSearch = searchTerm === '' || 
                    article.title.toLowerCase().includes(searchTerm) ||
                    article.excerpt.toLowerCase().includes(searchTerm);
                
                const matchesTag = activeTag === 'all' || article.tags.includes(activeTag);
                
                return matchesSearch && matchesTag;
            });

            currentPage = 1;
            renderArticles();
        }

        // Открытие статьи
        function openArticle(id) {
            const article = articlesData.find(a => a.id === id);
            if (!article) return;

            const modal = document.getElementById('articleModal');
            const fullArticle = document.getElementById('articleFull');

            fullArticle.innerHTML = `
                <div class="article-header">
                    <h1 class="article-full-title">${article.title}</h1>
                    <div class="article-full-meta">
                        <span><i class="fas fa-calendar"></i> ${formatDate(article.date)}</span>
                        <span><i class="fas fa-clock"></i> ${article.readTime}</span>
                        <span><i class="fas fa-tags"></i> ${article.tags.map(tag => getTagName(tag)).join(', ')}</span>
                    </div>
                </div>
                <img src="${article.image || createPlaceholderImage(article.title)}" 
                     alt="${article.title}" 
                     class="article-full-image"
                     onerror="this.src='${createPlaceholderImage(article.title)}'">
                <div class="article-body">
                    ${article.content}
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Закрытие статьи
        function closeArticle() {
            const modal = document.getElementById('articleModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Закрытие по клику вне модального окна
        document.getElementById('articleModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeArticle();
            }
        });

        // Вспомогательные функции
        function formatDate(dateString) {
            const date = new Date(dateString);
            const months = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
            return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
        }

        function getTagName(tag) {
            const tagNames = {
                'gods': 'Боги',
                'rituals': 'Обряды',
                'holidays': 'Праздники',
                'myths': 'Мифы'
            };
            return tagNames[tag] || tag;
        }

        // Закрытие по Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeArticle();
            }
        });
    </script>
</body>

</html>
