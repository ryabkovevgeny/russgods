    <script>

            {
                id: 1,
                title: "Перун и Велес: вечное противостояние",
                excerpt: "История космической битвы между богом неба и хозяином подземного мира, которая легла в основу многих славянских мифов и обрядов.",
                tags: ["gods", "myths"],
                date: "2024-01-15",
                readTime: "10 мин",
                image: "images/articles/perun-veles.jpg",
                content: `
                    <h2>Космическая битва</h2>
                    <p>В славянской мифологии противостояние Перуна и Велеса представляет собой один из основных космогонических мифов. Это не просто борьба двух богов, а символическое отражение вечного конфликта между порядком и хаосом, верхним и нижним мирами.</p>
                    
                    <h3>Перун — страж порядка</h3>
                    <p>Перун, бог-громовержец, восседает на вершине Мирового древа. Он охраняет небесный порядок, защищает мир людей от хаотических сил. Его молнии — это не только оружие, но и инструмент установления космической справедливости.</p>
                    
                    <blockquote>
                        "И ударил Перун золотой стрелой-молнией, и расступилась земля, и скрылся Велес в подземных чертогах своих..."
                        <cite>— Из древнерусских преданий</cite>
                    </blockquote>
                    
                    <h3>Велес — хранитель тайн</h3>
                    <p>Велес же, напротив, связан с нижним миром, с водами и подземельями. Он не является злом в абсолютном смысле — скорее, он представляет иную, хтоническую силу, необходимую для баланса мироздания. Велес — хранитель мудрости предков, проводник душ, покровитель богатства.</p>
                    
                    <h2>Цикличность конфликта</h2>
                    <p>Важнейшая особенность этого мифа — его цикличность. Перун побеждает Велеса, но тот возрождается вновь. Этот цикл отражает смену времён года: летом торжествует Перун, зимой сила переходит к Велесу.</p>
                    
                    <h3>Отголоски в фольклоре</h3>
                    <p>Мотивы этого противостояния прослеживаются во множестве сказок и былин:</p>
                    <ul>
                        <li>Борьба богатыря со Змеем (Велес часто принимает образ змея)</li>
                        <li>Похищение скота или женщин драконом и их освобождение героем</li>
                        <li>Сказки о подземных царствах и их владыках</li>
                    </ul>
                    
                    <h2>Ритуальное воплощение</h2>
                    <p>В обрядовой практике славян это противостояние воплощалось в:</p>
                    <ul>
                        <li>Весенних обрядах изгнания зимы (победа Перуна)</li>
                        <li>Осенних праздниках урожая (дары Велеса)</li>
                        <li>Грозовых ритуалах для вызова дождя</li>
                    </ul>
                    
                    <p>Таким образом, миф о Перуне и Велесе — это не просто история о вражде двух богов, а глубокая космологическая концепция, объясняющая устройство мира и природные циклы.</p>
                `

            {

                excerpt: "Самый мистический праздник славян, когда стираются границы между мирами, расцветает папоротник и исполняются желания.",

                date: "2024-01-20",
                readTime: "8 мин",
                image: "images/articles/kupala.jpg",
                content: `
                    <h2>Ночь чудес и волшебства</h2>
                    <p>Купальская ночь — один из важнейших праздников славянского календаря, приходящийся на летнее солнцестояние. В эту ночь, по поверьям, происходят настоящие чудеса: травы обретают целебную силу, вода становится священной, а в лесу расцветает волшебный цветок папоротника.</p>
                    
                    <h3>Священный огонь</h3>
                    <p>Центральным элементом празднования были купальские костры. Их разжигали на возвышенностях, часто у воды. Огонь добывался древним способом — трением дерева о дерево, что придавало ему особую сакральную силу.</p>
                    
                    <h2>Обряды и традиции</h2>
                    <p>Купальская ночь была наполнена разнообразными обрядами:</p>
                    <ul>
                        <li><strong>Прыжки через костёр</strong> — очищение от болезней и сглаза</li>
                        <li><strong>Пускание венков по воде</strong> — девичьи гадания на суженого</li>
                        <li><strong>Сбор трав</strong> — в эту ночь растения обретают максимальную силу</li>
                        <li><strong>Поиск цветка папоротника</strong> — дарующего ясновидение и клады</li>
                        <li><strong>Обливание водой</strong> — ритуальное очищение</li>
                    </ul>
                    
                    <blockquote>
                        "На Купалу ночь мала, а сила в ней велика"
                        <cite>— Народная поговорка</cite>
                    </blockquote>
                    
                    <h3>Любовная магия</h3>
                    <p>Купала считался праздником любви и плодородия. Молодые пары прыгали через костёр, держась за руки — если руки не разомкнутся, быть свадьбе. Одинокие искали свою пару в хороводах и играх.</p>
                    
                    <h2>Травы и зелья</h2>
                    <p>Особое значение имел сбор трав. Считалось, что именно в купальскую ночь растения обретают волшебные свойства:</p>
                    <ul>
                        <li><strong>Полынь</strong> — защита от злых духов</li>
                        <li><strong>Чабрец</strong> — для привлечения любви</li>
                        <li><strong>Зверобой</strong> — от всех болезней</li>
                        <li><strong>Иван-да-марья</strong> — для семейного счастья</li>
                    </ul>
                    
                    <h3>Мистические опасности</h3>
                    <p>Но Купальская ночь таила и опасности. Считалось, что в эту ночь особенно активны русалки, мавки и прочая нечисть. Чтобы защититься, люди носили с собой полынь, крапиву и чеснок.</p>
                    
                    <h2>Современное празднование</h2>
                    <p>Сегодня традиция празднования Ивана Купалы возрождается. Во многих местах устраивают фестивали с кострами, хороводами, народными песнями. Это не просто дань традиции, но и способ почувствовать связь с природой и предками.</p>
                `

            {

                title: "Мокошь: Великая Мать и её культ",
                excerpt: "Единственная богиня в пантеоне князя Владимира. История почитания женского божества от древности до наших дней.",
                tags: ["gods", "rituals"],
                date: "2024-02-01",
                readTime: "12 мин",
                image: "images/articles/mokosh.jpg",
                content: `
                    <h2>Великая богиня славян</h2>
                    <p>Мокошь занимает особое место в славянском пантеоне — она единственная богиня, упомянутая в летописном списке идолов князя Владимира 980 года. Это свидетельствует о её исключительной важности в религиозной жизни древних славян.</p>
                    
                    <h3>Имя и его значение</h3>
                    <p>Этимология имени Мокошь до сих пор вызывает споры среди учёных. Наиболее вероятные версии связывают его с:</p>
                    <ul>
                        <li>Корнем "мок-" (мокрый, влажный) — связь с водой и плодородием</li>
                        <li>Словом "кош" (жребий, судьба) — Мокошь как богиня судьбы</li>
                        <li>Древним корнем "мок" (прясть) — покровительница женских ремёсел</li>
                    </ul>
                    
                    <h2>Сферы влияния</h2>

            const totalPages = Math.ceil(filteredArticles.length / articlesPerPage);
            const pageNumbers = document.getElementById('pageNumbers');
            
            pageNumbers.innerHTML = '';
            
            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.textContent = i;
                pageBtn.onclick = () => goToPage(i);
                pageNumbers.appendChild(pageBtn);
            }

            // Управление кнопками prev/next
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        function goToPage(page) {
            currentPage = page;
            renderArticles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Инициализация контролов
        function initializeControls() {
            // Поиск
            const searchInput = document.getElementById('articleSearch');
            let searchTimeout;
            
            searchInput.addEventListener('input', function(e) {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    filterArticles();
                }, 300);
            });

            // Теги
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    activeTag = this.getAttribute('data-tag');
                    filterArticles();
                });
            });

            // Пагинация
            document.getElementById('prevPage').onclick = () => {
                if (currentPage > 1) goToPage(currentPage - 1);
            };

            document.getElementById('nextPage').onclick = () => {
                const totalPages = Math.ceil(filteredArticles.length / articlesPerPage);
                if (currentPage < totalPages) goToPage(currentPage + 1);
            };
        }

        // Фильтрация статей
        function filterArticles() {
            const searchTerm = document.getElementById('articleSearch').value.toLowerCase();
            
            filteredArticles = articlesData.filter(article => {
                const matchesSearch = searchTerm === '' || 
                    article.title.toLowerCase().includes(searchTerm) ||
                    article.excerpt.toLowerCase().includes(searchTerm);
                
                const matchesTag = activeTag === 'all' || article.tags.includes(activeTag);
                
                return matchesSearch && matchesTag;
            });

            currentPage = 1;
            renderArticles();
        }

        // Открытие статьи
        function openArticle(id) {
            const article = articlesData.find(a => a.id === id);
            if (!article) return;

            const modal = document.getElementById('articleModal');
            const fullArticle = document.getElementById('articleFull');

            fullArticle.innerHTML = `
                <div class="article-header">
                    <h1 class="article-full-title">${article.title}</h1>
                    <div class="article-full-meta">
                        <span><i class="fas fa-calendar"></i> ${formatDate(article.date)}</span>
                        <span><i class="fas fa-clock"></i> ${article.readTime}</span>
                        <span><i class="fas fa-tags"></i> ${article.tags.map(tag => getTagName(tag)).join(', ')}</span>
                    </div>
                </div>
                <img src="${article.image || createPlaceholderImage(article.title)}" 
                     alt="${article.title}" 
                     class="article-full-image"
                     onerror="this.src='${createPlaceholderImage(article.title)}'">
                <div class="article-body">
                    ${article.content}
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Закрытие статьи
        function closeArticle() {
            const modal = document.getElementById('articleModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Закрытие по клику вне модального окна
        document.getElementById('articleModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeArticle();
            }
        });

        // Вспомогательные функции
        function formatDate(dateString) {
            const date = new Date(dateString);
            const months = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
            return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
        }

        function getTagName(tag) {
            const tagNames = {
                'gods': 'Боги',
                'rituals': 'Обряды',
                'holidays': 'Праздники',
                'myths': 'Мифы'
            };
            return tagNames[tag] || tag;
        }

        // Закрытие по Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeArticle();
            }
        });
    </script>
</body>
</html>
