    <script>
        // База данных статей
        const articlesData = [
            {
                id: 1,
                title: "Перун и Велес: вечное противостояние",
                excerpt: "История космической битвы между богом неба и хозяином подземного мира, которая легла в основу многих славянских мифов и обрядов.",
                tags: ["gods", "myths"],
                date: "2025-01-15",
                readTime: "10 мин",
                image: "images/articles/perun-veles.jpg",
                content: `
                    <h2>Космическая битва: основа мироздания</h2>
                    <p>В фундаменте славянского миропонимания лежит дуализм — представление о мире как о единстве и борьбе двух противоположных начал. Наиболее ярко и масштабно этот дуализм воплотился в эпическом противостоянии двух ключевых фигур пантеона: громовержца Перуна и хтонического Велеса. Это не просто история о вражде двух могущественных существ, а глубокий космогонический миф, объясняющий само устройство Вселенной, смену времен года, циклы жизни и смерти, установление социального порядка и моральных законов. Их вечный конфликт — это двигатель мировой динамики, источник обновления и одновременно гарантия стабильности миропорядка.</p>

                    <h3>Перун — громовержец и державный воитель</h3>
                    <p>Перун, верховный бог княжеской дружины, повелитель грома и молний, олицетворяет собой мужское, активное, небесное начало. Его стихия — ярость летней грозы, очищающая землю от скверны, и беспощадный блеск стали в бою. Он восседает на вершине Мирового Древа, в Прави — мире богов и закона. Перун — это космический суверенитет, военная мощь, клятва и договор, которые скрепляются его священным именем. Его оружие — палица, топор или стрелы-молнии — это не только инструмент разрушения, но и акт созидания: рассекая темные тучи, он ниспосылает живительный дождь, оплодотворяя землю. Он — страж миропорядка, защитник Яви (мира живых) от сил хаоса и нави (мира мертвых), которые стремится нарушить его вечный оппонент.</p>

                    <blockquote>
                        "И ударил Перун золотой стрелой-молнией, и расступилась земля, и скрылся Велес в подземных чертогах своих..."
                        <cite>— Из древнерусских преданий</cite>
                    </blockquote>

                    <h3>Велес — владыка таинственных сил</h3>
                    <p>Велес, «скотий бог», волхв и чародей, представляет собой принципиально иную, но не менее vitalную силу. Он связан с землей, водой (особенно подземными источниками и болотами), миром мертвых (Навью) и подземными богатствами. Если Перун — бог-воин, то Велес — бог-маг, хранитель древней, доолимпийской мудрости, знаний, искусств и ремесел. Он покровительствует не только домашнему скоту, но и вообще всякому богатству, удаче, изобилию. Его часто представляют в облике могучего медведя или змея, что подчеркивает его связь с дикой, неукрощенной природой, с теми силами, что находятся за гранью человеческого контроля и понимания. Велес — проводник душ в загробный мир и хранитель предков, что делает его фигурой амбивалентной: он и даритель благ, и повелитель темных, хтонических глубин.</p>

                    <h2>Миф о похищении: ядро противостояния</h2>
                    <p>Центральный сюжет вражды богов — похищение Велесом небесных стад или супруги Перуна (в различных вариациях мифа). Этот акт является не простым воровством, а вызовом установленному порядку, святотатственным вторжением хаоса в космос. В ответ разгневанный Перун пускается в погоню. Их битва сотрясает мироздание: грохот грома — это звук их схватки, молнии — удары палицы Перуна, а ураганы и смерчи — следствие бегства Велеса, принимающего различные обличья. В конечном счете, громовержец одерживает победу, повергает противника и освобождает похищенное. Однако поражение Велеса не является окончательным и тотальным. Он не уничтожается, а изгоняется в низший мир, под землю или на край света, откуда продолжает свое влияние.</p>

                    <h3>Цикличность и вечное возвращение</h3>
                    <p>Важнейшая черта этого мифа — его цикличность. Каждый год история повторяется. Летом, в период гроз, сила Перуна достигает апогея, и он утверждает свою власть. Но с наступлением осени и увяданием природы мощь громовержца ослабевает. Зимой, когда земля замерзает и покрывается снегом, а небо молчит, безраздельно властвует Велес. Его время — это время подполья, тайны, сна и смерти. А с первыми весенними грозами, знаменующими возвращение Перуна, цикл начинается заново. Таким образом, их борьба — это метафора вечного круговорота природы, где смерть necessary для последующего возрождения, а хаос является неотъемлемой частью общего порядка вещей.</p>

                    <h2>Отголоски в фольклоре и обрядности</h2>
                    <p>Архетипический сюжет противостояния небесного героя и хтонического противника пронизывает весь пласт славянского фольклора и обрядов:</p>
                    <ul>
                        <li><strong>Былины и сказки:</strong> Борьба богатыря (Ильи Муромца, Добрыни Никитича) со Змеем Горынычем — это прямое отражение мифа. Похищение Змеем царь-девиц или скота и последующее освобождение их героем почти дословно повторяет сюжет о Перуне и Велесе.</li>
                        <li><strong>Календарные обряды:</strong> Весенние ритуалы (на Масленицу или на Юрьев день), связанные с проводами зимы и «прогоном» смерти/болезни, символизировали победу сил света и тепла (Перуна) над силами тьмы и холода (Велеса). Осенние праздники урожая, напротив, были временем почитания Велеса как дарителя земных благ, когда ему приносились дары за обеспеченное благополучие.</li>
                        <li><strong>Социальное измерение:</strong> Это противостояние имело и социальный аспект. Перун считался богом княжеской власти, дружины, формального закона. Велес же был ближе к земледельцам, скотоводам, волхвам — ко всему, что связано с народной, «низовой» культурой и магией. Их конфликт можно рассматривать и как метафору напряжения между центром (княжеская власть) и периферией (народная традиция).</li>
                    </ul>

                    <h2>Единство в противоборстве</h2>
                    <p>Несмотря на антагонизм, Перун и Велес не мыслились как абсолютное добро и абсолютное зло. Они — две стороны одной медали, взаимодополняющие и взаимообусловленные силы. Без разрушительной, но и оплодотворяющей силы грозы Перуна невозможен был бы рост. Без подземной, «смертной» силы Велеса, хранящей семена и души предков, невозможны были бы возрождение и новое рождение. Их вечная борьба — это не война на уничтожение, а сложный, динамичный танец, в котором рождается и поддерживается сама жизнь. В этом глубочайшем дуализме — ключ к пониманию славянского языческого мировоззрения, видевшего гармонию не в статичном покое, а в вечном, бьющем через край напряжении между космосом и хаосом.</p>
                `
            },
            {
                id: 2,

        <p>Вернулся пастух в свою деревню, но не стал хвалиться волшебным руном. Вместо этого научил он людей рыть колодцы там, где вода близка к поверхности, показал, какие травы помогут скоту пережить засуху, какие корни съедобны для человека. Научил он их читать знаки природы и жить в ладу с землей.</p>
        
        <p>И отступила засуха, зазеленели поля, ожили стада. А Велес с высоты своего чертога улыбался, глядя на мудрого пастуха, что понял главную тайну - истинное золотое руно мудрости живет в сердце каждого, кто готов учиться и делиться знанием с другими.</p>
        
        <p>С тех пор в народе говорят: "Велес дает мудрость не тому, кто ищет богатства, а тому, кто ищет знания для помощи другим." И каждый пастух, выводя стадо на рассвете, кланяется в сторону леса, где, по преданию, бродит великий бог, храня границу между мирами и даруя мудрость достойным.</p>
        
        <h3>Уроки сказания</h3>
        <p>Это древнее сказание учит нас нескольким важным истинам:</p>
        <ul>
            <li><strong>Мудрость важнее силы</strong> - Ярило прошел испытания не физической мощью, а умом и сердцем</li>
            <li><strong>Знание должно служить людям</strong> - истинная ценность мудрости в том, чтобы помогать другим</li>
            <li><strong>Доверие - высшая ценность</strong> - его нельзя купить или отнять, только заслужить</li>
            <li><strong>Велес испытывает, но и учит</strong> - каждое испытание было уроком</li>
        </ul>
        
        <p>Так через века доходит до нас мудрость предков, напоминая, что настоящее богатство - не в золоте, а в знаниях и умении применить их во благо.</p>
    `
}
        ];

        // Состояние приложения
        let currentPage = 1;
        const articlesPerPage = 6;
        let filteredArticles = [...articlesData];
        let activeTag = 'all';

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            renderArticles();
            initializeControls();
        });

        // Функция отрисовки статей
        function renderArticles() {
            const grid = document.getElementById('articlesGrid');
            const start = (currentPage - 1) * articlesPerPage;
            const end = start + articlesPerPage;
            const pageArticles = filteredArticles.slice(start, end);

            grid.innerHTML = pageArticles.map(article => `
                <article class="article-card" onclick="openArticle(${article.id})">
                    <img src="${article.image || createPlaceholderImage(article.title)}" 
                         alt="${article.title}" 
                         class="article-image"
                         onerror="this.src='${createPlaceholderImage(article.title)}'">
                    <div class="article-content">
                        <div class="article-tags">
                            ${article.tags.map(tag => `
                                <span class="article-tag">${getTagName(tag)}</span>
                            `).join('')}
                        </div>
                        <h2 class="article-title">${article.title}</h2>
                        <p class="article-excerpt">${article.excerpt}</p>
                        <div class="article-meta">
                            <span class="article-date">
                                <i class="fas fa-calendar"></i>
                                ${formatDate(article.date)}
                            </span>
                            <span class="article-readtime">
                                <i class="fas fa-clock"></i>
                                ${article.readTime}
                            </span>
                        </div>
                    </div>
                </article>
            `).join('');

            renderPagination();
        }

        // Функция создания заглушки для изображения
        function createPlaceholderImage(title) {
            const colors = ['#00bcd4', '#4caf50', '#f44336', '#ff9800', '#9c27b0'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            return `data:image/svg+xml;charset=UTF-8,%3Csvg width='400' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='400' height='200' fill='${encodeURIComponent(color)}'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='Russo One' font-size='24' fill='white'%3E${encodeURIComponent(title.substring(0, 20))}%3C/text%3E%3C/svg%3E`;
        }

        // Пагинация
        function renderPagination() {
            const totalPages = Math.ceil(filteredArticles.length / articlesPerPage);
            const pageNumbers = document.getElementById('pageNumbers');
            
            pageNumbers.innerHTML = '';
            
            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.textContent = i;
                pageBtn.onclick = () => goToPage(i);
                pageNumbers.appendChild(pageBtn);
            }

            // Управление кнопками prev/next
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = currentPage === totalPages;
        }

        function goToPage(page) {
            currentPage = page;
            renderArticles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Инициализация контролов
        function initializeControls() {
            // Поиск
            const searchInput = document.getElementById('articleSearch');
            let searchTimeout;
            
            searchInput.addEventListener('input', function(e) {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    filterArticles();
                }, 300);
            });

            // Теги
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    activeTag = this.getAttribute('data-tag');
                    filterArticles();
                });
            });

            // Пагинация
            document.getElementById('prevPage').onclick = () => {
                if (currentPage > 1) goToPage(currentPage - 1);
            };

            document.getElementById('nextPage').onclick = () => {
                const totalPages = Math.ceil(filteredArticles.length / articlesPerPage);
                if (currentPage < totalPages) goToPage(currentPage + 1);
            };
        }

        // Фильтрация статей
        function filterArticles() {
            const searchTerm = document.getElementById('articleSearch').value.toLowerCase();
            
            filteredArticles = articlesData.filter(article => {
                const matchesSearch = searchTerm === '' || 
                    article.title.toLowerCase().includes(searchTerm) ||
                    article.excerpt.toLowerCase().includes(searchTerm);
                
                const matchesTag = activeTag === 'all' || article.tags.includes(activeTag);
                
                return matchesSearch && matchesTag;
            });

            currentPage = 1;
            renderArticles();
        }

        // Открытие статьи
        function openArticle(id) {
            const article = articlesData.find(a => a.id === id);
            if (!article) return;

            const modal = document.getElementById('articleModal');
            const fullArticle = document.getElementById('articleFull');

            fullArticle.innerHTML = `
                <div class="article-header">
                    <h1 class="article-full-title">${article.title}</h1>
                    <div class="article-full-meta">
                        <span><i class="fas fa-calendar"></i> ${formatDate(article.date)}</span>
                        <span><i class="fas fa-clock"></i> ${article.readTime}</span>
                        <span><i class="fas fa-tags"></i> ${article.tags.map(tag => getTagName(tag)).join(', ')}</span>
                    </div>
                </div>
                <img src="${article.image || createPlaceholderImage(article.title)}" 
                     alt="${article.title}" 
                     class="article-full-image"
                     onerror="this.src='${createPlaceholderImage(article.title)}'">
                <div class="article-body">
                    ${article.content}
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Закрытие статьи
        function closeArticle() {
            const modal = document.getElementById('articleModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Закрытие по клику вне модального окна
        document.getElementById('articleModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeArticle();
            }
        });

        // Вспомогательные функции
        function formatDate(dateString) {
            const date = new Date(dateString);
            const months = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
            return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
        }

        function getTagName(tag) {
            const tagNames = {
                'gods': 'Боги',
                'rituals': 'Обряды',
                'holidays': 'Праздники',
                'myths': 'Мифы'
            };
            return tagNames[tag] || tag;
        }

        // Закрытие по Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeArticle();
            }
        });
    </script>
</body>
</html>
